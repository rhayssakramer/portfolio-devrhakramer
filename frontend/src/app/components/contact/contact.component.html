<section class="page-wrapper contact-page">
  <div class="container">
    <div class="contact-header">
      <h1>Entre em Contato</h1>
      <p class="subtitle">Vamos trabalhar juntos</p>
    </div>

    <p class="description">
      Estou sempre aberto a novas oportunidades e projetos interessantes. Não hesite em entrar em contato!
    </p>

    <div class="contact-layout">
      <!-- Cards de informações à esquerda -->
      <div class="contact-info">
        <div *ngFor="let info of contactInfo" 
             class="info-card animate-from-left" 
             [style.animation-delay]="info.delay">
          <div class="icon-wrapper">
            <img *ngIf="info.customIcon" 
                 [src]="info.customIcon" 
                 [alt]="info.title" 
                 width="28" 
                 height="28" />
            <svg *ngIf="!info.customIcon" 
                 xmlns="http://www.w3.org/2000/svg" 
                 width="24" 
                 height="24" 
                 viewBox="0 0 24 24" 
                 fill="currentColor">
              <path [attr.d]="info.svgPath"/>
            </svg>
          </div>
          <div class="info-content">
            <h3>{{ info.title }}</h3>
            <a *ngIf="info.link" 
               [href]="info.link" 
               [target]="info.isExternal ? '_blank' : '_self'" 
               [rel]="info.isExternal ? 'noopener' : ''">{{ info.value }}</a>
            <p *ngIf="!info.link">{{ info.value }}</p>
          </div>
        </div>
      </div>

      <!-- Formulário à direita -->
      <div class="contact-form-wrapper animate-from-right">
        <form class="contact-form" (submit)="onSubmit($event)">
          <div class="form-group">
            <label for="name">Nome</label>
            <input 
              type="text" 
              id="name" 
              name="name" 
              [(ngModel)]="formData.name"
              placeholder="João Silva"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input 
              type="email" 
              id="email" 
              name="email" 
              [(ngModel)]="formData.email"
              placeholder="joao@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="message">Mensagem</label>
            <textarea 
              id="message" 
              name="message" 
              [(ngModel)]="formData.message"
              placeholder="Sua mensagem..."
              rows="6"
              required
            ></textarea>
          </div>

          <!-- Mensagem de sucesso -->
          <div class="alert alert-success" *ngIf="submitStatus === 'success'">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Mensagem enviada com sucesso! Entrarei em contato em breve.
          </div>

          <!-- Mensagem de erro -->
          <div class="alert alert-error" *ngIf="submitStatus === 'error'">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" x2="12" y1="8" y2="12"/>
              <line x1="12" x2="12.01" y1="16" y2="16"/>
            </svg>
            {{ errorMessage }}
          </div>

          <button type="submit" class="submit-btn" [disabled]="isSubmitting">
            <!-- Spinner de loading -->
            <svg *ngIf="isSubmitting" class="spinner" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
            </svg>
            
            <!-- Ícone de envio normal -->
            <svg *ngIf="!isSubmitting" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m22 2-7 20-4-9-9-4Z"/>
              <path d="M22 2 11 13"/>
            </svg>
            
            {{ isSubmitting ? 'Enviando...' : 'Enviar Mensagem' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
