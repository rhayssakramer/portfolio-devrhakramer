<aside class="profile">
  <button class="toggle-contacts"
    (click)="toggleContacts()"
    [ngClass]="{ 'toggle-contacts--closed': !showContacts, 'toggle-contacts--open': showContacts }"
    attr.aria-expanded="{{showContacts}}"
    attr.aria-label="{{showContacts ? 'Ocultar Contatos' : 'Mostrar Contatos'}}">
    <span class="toggle-icon" aria-hidden="true">
      <svg class="toggle-triangle" viewBox="0 0 24 16" xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
        <polygon points="0,0 24,0 12,16" />
      </svg>
    </span>
  </button>
  <div class="profile-card" [ngClass]="{'open': showContacts}">
    <div class="avatar">
      <img src="assets/images/profile.jpg" alt="Foto de perfil" />
    </div>
    <h2 class="name">Rhayssa Kramer</h2>
    <span class="role-pill">{{ roleText() }}</span>

    <div class="divider"></div>

    <ul class="contact">
      <li *ngFor="let contact of contactsData()">
        <span class="icon" aria-hidden="true">
          <svg [attr.viewBox]="contact.viewBox" width="24" height="24" 
               [attr.fill]="contact.fill || 'currentColor'" 
               [attr.stroke]="contact.stroke"
               [attr.stroke-width]="contact.strokeWidth"
               [attr.stroke-linecap]="contact.strokeLinecap"
               [attr.stroke-linejoin]="contact.strokeLinejoin"
               xmlns="http://www.w3.org/2000/svg" focusable="false" aria-hidden="true">
            <ng-container *ngIf="contact.svgType === 'path' && typeof contact.svgContent === 'string'">
              <path [attr.d]="contact.svgContent"/>
            </ng-container>
            <ng-container *ngIf="contact.svgType === 'multi' && Array.isArray(contact.svgContent)">
              <ng-template ngFor let-p [ngForOf]="$any(contact.svgContent)">
                <path [attr.d]="$any(p).d" 
                      [attr.stroke]="$any(p).stroke || null" [attr.stroke-width]="$any(p).strokeWidth || null"
                      [attr.stroke-linecap]="$any(p).strokeLinecap || null" [attr.stroke-linejoin]="$any(p).strokeLinejoin || null"/>
              </ng-template>
              <rect *ngIf="contact.svgRect" 
                    [attr.x]="contact.svgRect.x" [attr.y]="contact.svgRect.y" 
                    [attr.width]="contact.svgRect.width" [attr.height]="contact.svgRect.height"
                    [attr.rx]="contact.svgRect.rx" [attr.stroke]="contact.svgRect.stroke"
                    [attr.stroke-width]="contact.svgRect.strokeWidth" [attr.stroke-linecap]="contact.svgRect.strokeLinecap"/>
            </ng-container>
          </svg>
        </span>
        <div>
          <strong>{{ contact.label }}</strong>
          <small>
            <a *ngIf="contact.link" [href]="contact.link">{{ contact.text }}</a>
            <ng-container *ngIf="!contact.link">{{ contact.text }}</ng-container>
          </small>
        </div>
      </li>
    </ul>

    <div class="social">
      <a *ngFor="let social of socialLinks" 
         class="social-btn icon-only" 
         [attr.aria-label]="social.label" 
         [href]="social.link" 
         target="_blank" 
         rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" focusable="false" aria-hidden="true">
          <path [attr.d]="social.svgPath"/>
        </svg>
      </a>
    </div>
  </div>
</aside>
